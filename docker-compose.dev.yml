services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db_dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    container_name: flask_app_dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    networks:
      - app-network
    command: ["flask", "run", "--host=0.0.0.0", "--reload"]

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - app-network

volumes:
  postgres_data_dev:
    driver: local

networks:
  app-network:
    driver: bridge
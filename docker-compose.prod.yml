services:

    db:
        image: postgres:15-alpine
        container_name: postgres_db_prod
        restart: always
        env_file:
            - .env.prod
        volumes:
            - postgres_data_prod:/var/lib/postgresql/data
        networks:
            - backend-network
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    app:
        build:
            context: ./backend
            dockerfile: docker/Dockerfile.prod
        container_name: flask_app_prod
        restart: always
        env_file:
            - .env.prod
        environment:
            - FLASK_APP=app.wsgi
            - FLASK_ENV=prod
            - SOCKETIO_ASYNC_MODE=eventlet
        volumes:
            - media_data:/app/static/media
        depends_on:
            db:
                condition: service_healthy
        networks:
            - backend-network
        ports:
            - "5001:5001"
        command: |
            sh -c "flask init-db && flask seed-db --count 500 && gunicorn --worker-class eventlet --workers 1 --bind 0.0.0.0:5001 --timeout 120 --keep-alive 5 --log-level info --access-logfile - --error-logfile - app.wsgi:app"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s

    frontend:
        image: node:20-alpine
        container_name: nextjs_app_prod
        restart: unless-stopped
        working_dir: /app
        ports:
            - "3000:3000"
        volumes:
            - ./frontend:/app
            - /app/node_modules
            - /app/.next
        depends_on:
            - app
        networks:
            - backend-network
        # command: sh -c "npm install && npm run dev"
        command: sh -c "npm install --include=dev && npm run build && npm start"
        environment:
            - NODE_ENV=production
            # - NODE_ENV=dev

volumes:
    postgres_data_prod:
        driver: local
    media_data:
        driver: local

networks:
    backend-network:
        driver: bridge
    frontend-network:
        driver: bridge

services:
    db:
        image: postgres:15-alpine
        container_name: postgres_db_dev
        restart: unless-stopped
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - postgres_data_dev:/var/lib/postgresql/data
        networks:
            - app-network

    app:
        build:
            context: ./backend
            dockerfile: docker/Dockerfile
        container_name: flask_app_dev
        restart: unless-stopped
        env_file:
            - .env
        environment:
            - FLASK_APP=app.wsgi
            - FLASK_ENV=dev
            - SOCKETIO_ASYNC_MODE=eventlet
        ports:
            - "5001:5000"
        volumes:
            - ./backend:/app
        depends_on:
            - db
        networks:
            - app-network
        command: >
            sh -c "
                flask init-db &&
                flask seed-db &&
                python -m app.wsgi
            "
    frontend:
        image: node:20-alpine
        container_name: nextjs_app_dev
        restart: unless-stopped
        working_dir: /app
        ports:
            - "3000:3000"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        depends_on:
            - app
        networks:
            - app-network
        command: sh -c "npm install && npm run dev"
        environment:
            - NODE_ENV=development

volumes:
    postgres_data_dev:
        driver: local

networks:
    app-network:
        driver: bridge
